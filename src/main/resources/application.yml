spring:
  datasource:
    username: ${MYSQL_USERNAME:}
    password: ${MYSQL_PASSWORD:}
    url: ${MYSQL_URL:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maxLifetime: 600000
      idleTimeout: 600000
      ConnectionTestQuery: SELECT 1
  application:
    name: hotta-data-admin
  data:
    redis:
      database: 5
      host: ${REDIS_HOST:}
      port: ${REDIS_PORT:}
    mongodb:
      uri: ${MONGODB_URI:}
  cache:
    type: redis
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-returns: true
    template:
      mandatory: true
    ssl:
      enabled: true
    listener:
      simple:
        prefetch: 1
        concurrency: 1
        max-concurrency: 2
        default-requeue-rejected: false

server:
  port: 5777
  tomcat:
    max-swallow-size: -1

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  config: classpath:Log4j2-spring.xml
  level:
    org.mybatis: DEBUG
    org.apache.ibatis: DEBUG
    com.hollow.build.mapper: DEBUG

com:
  hollow:
    token:
      secret-key: ${TOKEN_KEY:}
      validity-access-token: 60 # 皆为分钟
      validity-refresh-token: 480 # 皆为分钟
      username-max-attempt: 10
      ip-max-attempt: 5
      ttl-seconds: 15 # 皆为分钟
    open-api:
      enabled: false
      api-version: 0.0.1
      title: hotta-data-admin
      description: 试试限流
    minio:
      endpoint: ${MINIO_ENDPOINT:}
      access-key: ${MINIO_ACCESSKEY:}
      secret-key: ${MINIO_SECRETKEY:}
    google-drive:
      credentials-path: ./config/client_secret.json
      tokens-dir: ./config/tokens
      watch-dir: ./videos
      target-folder: video
      delete-after-upload: true
      cron: "0 */5 * * * ?"
    ai:
      text-api-key: ${AI_TEXT_APIKEY}
      text-model: ${AI_TEXT_MODEL}
      text-uri: ${AI_TEXT_URI}
      text-default-prompt: ${AI_TEXT_DEFAULT_PROMPT}

      image-api-key: ${AI_IMAGE_APIKEY}
      image-model: ${AI_IMAGE_MODEL}
      image-uri: ${AI_IMAGE_URI}
      image-default-prompt: ${AI_IMAGE_DEFAULT_PROMPT}

      proxy-address: ${AI_PROXY_ADDRESS}
      proxy-port: ${AI_PROXY_PORT}
      proxy-enabled: ${AI_PROXY_ENABLED}
    agent:
      # Agent 主循环最多跑几轮（防止 AI 不停调工具）
      max-iterations: 6
      # 一次 query_table 最多返回多少行
      max-query-limit: 50
      # AI 允许访问的表名白名单 —— 任何不在这里的表，工具都会拒绝
      allowed-tables:
        - blog_posts
        - event_news
        - role
      # AliasAgent 的别名表路径：存在即读外部文件，不存在则回退 classpath:agent/alias.json。
      # docker 部署时把宿主机文件挂载到 /app/config/alias.json 即可热替换。
      alias-file-path: ./config/alias.json
      # 各 agent 启动时的默认开关。运行时可通过 /api/v1/agent/admin/switches 改，
      # 但变更只在内存里，进程重启会回到这里的默认值。
      enabled-agents:
        database: false
        alias: true
    ocr:
      service-url: ${OCR_SERVICE_URL:http://127.0.0.1:7634/ocr}
      api-key: ${OCR_API_KEY:}
      default-mode: ${OCR_DEFAULT_MODE:detail}
      default-min-confidence: ${OCR_DEFAULT_MIN_CONFIDENCE:}
      result-ttl: ${OCR_RESULT_TTL:3600}
      max-file-size-bytes: ${OCR_MAX_FILE_SIZE_BYTES:52428800}
      submit-confirm-timeout-millis: ${OCR_SUBMIT_CONFIRM_TIMEOUT_MILLIS:5000}
      max-retry-count: ${OCR_MAX_RETRY_COUNT:3}
      retry-delay-millis: ${OCR_RETRY_DELAY_MILLIS:15000}
      minio-bucket: ${OCR_MINIO_BUCKET:ocr-temp}
      pending-timeout-seconds: ${OCR_PENDING_TIMEOUT_SECONDS:300}
      pending-timeout-scan-interval-millis: ${OCR_PENDING_TIMEOUT_SCAN_INTERVAL_MILLIS:60000}
      daily-ip-limit: ${OCR_DAILY_IP_LIMIT:20}
      allowed-content-types:
        - image/jpeg
        - image/jpg
        - image/png
        - image/webp
        - image/bmp
        - image/heic
        - image/heif
        - application/pdf
    fund:
      api-token: ${FUND_API_TOKEN:}   # 写接口(加/删监控)密钥，机器人请求头带 X-FUND-TOKEN；留空则不校验
      backfill-days: 365                               # 添加基金时回补的历史净值天数
      nav-sync-cron: "0 30 23 * * ?"                   # 每晚拉取最新净值
      nav-backup-cron: "0 30 5 * * ?"                  # 次日凌晨兜底再拉一次（覆盖 QDII 延迟）
      request-timeout-seconds: 15                      # 调用东方财富接口超时(秒)
      eastmoney-referer: "http://fund.eastmoney.com/"  # lsjz 历史净值接口必须带的 Referer
      risk-free-annual-rate: 0                          # 计算夏普比率使用的无风险年化收益率(%)